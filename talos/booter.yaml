apiVersion: apps/v1
kind: Deployment
metadata:
  name: booter
  namespace: kube-system
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: booter}}
  template:
    metadata: {labels: {app: booter}}
    spec:
      hostNetwork: true
      containers:
        - name: booter
          image: ghcr.io/siderolabs/booter:v0.4.0
          args: ["--debug", "--talos-version=v1.14.1"]
