name: CUE vet

on:
  push:

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.17.1

      # renovate 44 needs node ^24.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g renovate@44

      - name: Vet resources
        run: cue vet -c ./resources/...

      - name: Lint renovate annotations
        run: cue cmd lintrenovate ./resources/...
